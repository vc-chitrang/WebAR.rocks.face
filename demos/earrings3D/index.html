<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="content-language" content="en-EN" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />

    <title>WebAR.rocks.face 3D earrings demo</title>

    <!-- INCLUDE WebAR.rocks.face MAIN SCRIPT -->
    <script src="../../dist/WebARRocksFace.js"></script>

    <!-- INCLUDE EARRINGS3D HELPER -->
    <script src="../../helpers/WebARRocksFaceEarrings3DHelper.js"></script>

    <!-- THREE.JS, FOR THE RENDERING -->
    <!-- WARNING: for production you should replace three.js by three.min.js -->
    <script src="../../libs/three/v136/build/three.js"></script>
    <script src="../../libs/three/v136/examples/js/loaders/GLTFLoader.js"></script>

    <!-- THREE.JS RGBE loader - you can remove it if you don't use envmap: -->
    <script src="../../libs/three/v136/examples/js/loaders/RGBELoader.js"></script>

    <!-- THREE.JS postprocessing - you can remove it if you don't use bloom or temporal anti aliasing : -->
    <script src="../../libs/three/v136/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="../../libs/three/v136/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="../../libs/three/v136/examples/js/postprocessing/RenderPass.js"></script>
    <script src="../../libs/three/v136/examples/js/shaders/CopyShader.js"></script>

    <!-- Bloom postprocessing: -->
    <script src="../../libs/three/v136/examples/js/postprocessing/UnrealBloomPassTweaked.js"></script>
    <script src="../../libs/three/v136/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <!-- TAA specifics: -->
    <script src="../../libs/three/v136/examples/js/postprocessing/SSAARenderPass.js"></script>
    <script src="../../libs/three/v136/examples/js/postprocessing/TAARenderPass.js"></script>

    <!-- INCLUDE RESIZER HELPER -->
    <script src="../../helpers/WebARRocksResizer.js"></script>

    <!-- INCLUDE LANDMARKS STABILIZER -->
    <script src="../../helpers/landmarksStabilizers/OneEuroLMStabilizer.js"></script>

    <!-- INCLUDE DEMO SCRIPT -->
    <script src="./main.js"></script>

    <style type="text/css">
      body {
        margin: 0;
        overflow: hidden;
      }
      #WebARRocksFaceCanvas,
      #threeCanvas {
        position: fixed;
        width: 50vw;
        top: 0;
        left: 0;
        /* mirror the canvas: */
        transform: rotateY(180deg);
      }
      #WebARRocksFaceCanvas {
        z-index: 0;
      }
      #threeCanvas {
        z-index: 1;
        /*background-color: rgba(255, 0, 0, 0.5);*/
      }
      .card {
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }
      
      .card.selected {
        border-color: #007bff;
        transform: scale(1.05);
      }
      
      .card-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 4px;
        text-align: center;
        font-size: 12px;
      }
    </style>
    <link rel="stylesheet" href="StyleSheet.css" />
  </head>
  <body>
    <!-- canvas where the earring will be displayed: -->
    <canvas width="600" height="600" id="threeCanvas"></canvas>

    <!-- canvas where the video will be displayed: -->
    <canvas width="600" height="600" id="WebARRocksFaceCanvas"></canvas>

    <!-- Bottom Horizontal Scroll View -->
    <div class="card-scroll-container">
      <div class="card" data-earring="0">
        <img src="assets/previews/earring_0.jpg" alt="Earring Model 1" >
        <div class="card-label">Twist Diamond Hoop</div>
      </div>
      <div class="card" data-earring="1">
        <img src="assets/previews/earring_1.jpg" alt="Earring Model 2" >
        <div class="card-label">Gold V-Hoop</div>
      </div>
      <div class="card" data-earring="2">
        <img src="assets/previews/earring_2.jpg" alt="Earring Model 3" >
        <div class="card-label">Channel Set Hoop</div>
      </div>
      <div class="card" data-earring="3">
        <img src="assets/previews/earring_3.jpg" alt="Earring Model 4" >
        <div class="card-label">Snake Dangle</div>
      </div>
      <div class="card" data-earring="4">
        <img src="assets/previews/earring_4.jpg" alt="Earring Model 5">
        <div class="card-label">Butterfly Hoop</div>
      </div>    
      <div class="card" data-earring="5">
        <img src="assets/previews/earring_5.jpg" alt="Earring Model 5">
        <div class="card-label">Boho Circle Dangle</div>
      </div>    
    </div>

  </body>
</html>
