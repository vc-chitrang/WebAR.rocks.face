<!DOCTYPE html>
<header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center space-x-2">
        <svg class="h-8 w-8 text-yellow-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#FACC15"/>
        </svg>
        <span class="text-2xl font-serif font-bold text-gray-900">Solene Jewellers</span>
      </div>

      <nav class="hidden md:flex space-x-8">
        <button 
          onclick="scrollToSection('home')"
          class="text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Home
        </button>
        <button 
          onclick="scrollToSection('products')"
          class="text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Collections
        </button>
        <button 
          onclick="scrollToSection('try-on')"
          class="text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Virtual Try-On
        </button>
        <button 
          onclick="scrollToSection('about')"
          class="text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          About
        </button>
        <button 
          onclick="scrollToSection('contact')"
          class="text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Contact
        </button>
      </nav>

      <div class="flex items-center space-x-4">
        <button class="p-2 text-gray-700 hover:text-yellow-600 transition-colors duration-200">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2L3 6V20C3 20.5304 3.21071 21.0391 3.58579 21.4142C3.96086 21.7893 4.46957 22 5 22H19C19.5304 22 20.0391 21.7893 20.4142 21.4142C20.7893 21.0391 21 20.5304 21 20V6L18 2H6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 10C16 11.0609 15.5786 12.0783 14.8284 12.8284C14.0783 13.5786 13.0609 14 12 14C10.9391 14 9.92172 13.5786 9.17157 12.8284C8.42143 12.0783 8 11.0609 8 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button 
          class="md:hidden p-2 text-gray-700"
          onclick="toggleMenu()"
        >
          <svg id="menuIcon" class="h-6 w-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="mobileMenu" class="hidden md:hidden py-4 border-t border-gray-100">
      <nav class="flex flex-col space-y-3">
        <button 
          onclick="scrollToSection('home')"
          class="text-left text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Home
        </button>
        <button 
          onclick="scrollToSection('products')"
          class="text-left text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Collections
        </button>
        <button 
          onclick="scrollToSection('try-on')"
          class="text-left text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Virtual Try-On
        </button>
        <button 
          onclick="scrollToSection('about')"
          class="text-left text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          About
        </button>
        <button 
          onclick="scrollToSection('contact')"
          class="text-left text-gray-700 hover:text-yellow-600 transition-colors duration-200"
        >
          Contact
        </button>
      </nav>
    </div>
  </div>
</header>

<script>
function toggleMenu() {
  const mobileMenu = document.getElementById('mobileMenu');
  const menuIcon = document.getElementById('menuIcon');
  
  if (mobileMenu.classList.contains('hidden')) {
    mobileMenu.classList.remove('hidden');
    menuIcon.innerHTML = `
      <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  } else {
    mobileMenu.classList.add('hidden');
    menuIcon.innerHTML = `
      <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }
}

function scrollToSection(sectionId) {
  const section = document.getElementById(sectionId);
  if (section) {
    section.scrollIntoView({ behavior: 'smooth' });
    // Close mobile menu if open
    const mobileMenu = document.getElementById('mobileMenu');
    if (!mobileMenu.classList.contains('hidden')) {
      toggleMenu();
    }
  }
}
</script>
